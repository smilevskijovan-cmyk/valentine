<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Ива 💖</title>

<style>
body {
margin: 0;
height: 100vh;
background: linear-gradient(135deg, #ff9a9e, #fecfef);
display: flex;
justify-content: center;
align-items: center;
font-family: 'Comic Sans MS', cursive, sans-serif;
overflow: hidden;
}

.card {
background: white;
padding: 30px;
border-radius: 25px;
text-align: center;
box-shadow: 0 15px 30px rgba(0,0,0,0.25);
width: 330px;
z-index: 2;
}

h1 {
color: #ff4d6d;
}

p {
color: #444;
font-size: 16px;
}

button {
padding: 12px 22px;
margin: 10px;
font-size: 16px;
border: none;
border-radius: 30px;
cursor: pointer;
}

#yesBtn {
background: #ff4d6d;
color: white;
}

#noBtn {
background: #eee;
position: absolute;
}

.hidden {
display: none;
}

img {
width: 220px;
margin-top: 15px;
}

/* Floating hearts */
.heart {
position: absolute;
bottom: -20px;
font-size: 20px;
animation: floatUp 6s linear infinite;
opacity: 0.7;
}

@keyframes floatUp {
0% { transform: translateY(0); opacity: 0.7; }
100% { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>
<body>

<div class="card" id="question">
<h1>💌 Ива, will you be my Valentine? 💌</h1>
<p>I promise lots of smiles, hugs and love 💕</p>
<button id="yesBtn" onclick="yesClicked()">Yes 💖</button>
<button id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()">No 💔</button>
</div>

<div class="card hidden" id="love">
<h1>💘 Yaaay Ива!!! 💘</h1>
<p>
You just made my heart skip a beat 💕<br>
Happy Valentine’s Day 🌹<br>
I’m really lucky to have you 💖
</p>
<img src="https://i.imgur.com/1Q9Z1Zm.png" alt="Cute hearts">
</div>

<script>
function moveNo() {
const noBtn = document.getElementById("noBtn");
const x = Math.random() * (window.innerWidth - 120);
const y = Math.random() * (window.innerHeight - 60);
noBtn.style.left = x + "px";
noBtn.style.top = y + "px";
}

function yesClicked() {
document.getElementById("question").classList.add("hidden");
document.getElementById("love").classList.remove("hidden");
}

// Floating hearts generator
setInterval(() => {
const heart = document.createElement("div");
heart.className = "heart";
heart.innerHTML = "💖";
heart.style.left = Math.random() * 100 + "vw";
heart.style.fontSize = (16 + Math.random() * 20) + "px";
heart.style.animationDuration = (4 + Math.random() * 3) + "s";
document.body.appendChild(heart);

setTimeout(() => heart.remove(), 7000);
}, 400);
</script>

</body>

</html>
